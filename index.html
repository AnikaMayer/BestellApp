<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BestellApp</title>

        <link rel="stylesheet" href="./styles/standard.css" />
        <link rel="stylesheet" href="./styles/fonts.css" />
        <link rel="stylesheet" href="./styles/variables.css" />
        <link rel="stylesheet" href="./styles/assets.css" />
        <link rel="stylesheet" href="./styles/basket.css" />
        <link rel="stylesheet" href="./styles/dialog.css" />
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="./styles/responsive.css" />

        <script src="./scripts/db.js"></script>
        <script src="./scripts/template.js"></script>
        <script src="script.js" defer></script>

        <link
            rel="shortcut icon"
            href="./assets/icons/favicon_bestell_app_orange.svg"
            type="image/x-icon"
        />
    </head>
    <body onload="init()">
        <header class="header_main">
            <img
                class="logo_main"
                src="./assets/icons/logo_bestellapp.svg"
                alt="Bestell App Logo"
            />
            <img
                class="logo_menu"
                src="./assets/icons/menu.svg"
                alt="Menu Placeholder Image"
            />
        </header>
        <main>
            <section class="hero_section">
                <div class="hero_background">
                    <div class="background_image">
                        <img
                            class="burger_logo"
                            src="./assets/img/logo_burger.png"
                            alt="Burger Logo"
                        />
                    </div>
                </div>
                <div class="hero_content">
                    <div class="heading_box">
                        <h1><span class="heading_highlight">Burger</span>House</h1>
                        <div class="rating_box">
                            <img src="./assets/icons/star.svg" alt="Star Icon" />
                            <p>4,1 <span class="ratings">(317)</span></p>
                        </div>
                    </div>
                    <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
                </div>
            </section>
            <div class="content_wrapper">
                <div class="menu_wrapper">
                    <section class="menu_section">
                        <header class="header_section">
                            <img src="./assets/icons/burger_icon.svg" alt="Burger Icon" />
                            <div class="headline_category">
                                <h2>Burger & Sandwiches</h2>
                            </div>
                        </header>
                        <section id="dishes_burger" class="dishes"></section>
                    </section>
                    <section class="menu_section">
                        <header class="header_section">
                            <img src="./assets/icons/pizza_icon.svg" alt="Pizza Icon" />
                            <div class="headline_category">
                                <h2>Pizza <span>(30cm)</span></h2>
                            </div>
                        </header>
                        <section id="dishes_pizza" class="dishes"></section>
                    </section>
                    <section class="menu_section">
                        <header class="header_section">
                            <img src="./assets/icons/salad_icon.svg" alt="Salad Icon" />
                            <div class="headline_category">
                                <h2>Salad</h2>
                            </div>
                        </header>
                        <section id="dishes_salad" class="dishes"></section>
                    </section>
                </div>
                <div class="basket_outer_box">
                    <article class="basket">
                        <section class="basket_wrapper">
                            <h4>Your Basket</h4>
                            <div id="basket_box" class="basket_container">
                                <div id="basket_content" class="basket_items"></div>
                                <div id="basket_checkout" class="checkout"></div>
                            </div>
                        </section>
                    </article>
                </div>
                <dialog
                    id="order_confirmation"
                    class="dialog_wrapper"
                    onclick="closeDialog()"
                ></dialog>
            </div>
        </main>
        <footer class="footer_main">
            <div class="footer_content">
                <div class="copyright">
                    <img src="./assets/icons/copyright_icon.svg" alt="Copyright" />
                    <p>2025 BurgerHouse</p>
                </div>
                <p>Imprint</p>
                <p>Cookie Preferences</p>
            </div>
        </footer>
    </body>
</html>
