<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BestellApp</title>

        <link rel="stylesheet" href="./styles/standard.css" />
        <link rel="stylesheet" href="./styles/fonts.css" />
        <link rel="stylesheet" href="./styles/variables.css" />
        <link rel="stylesheet" href="./styles/assets.css" />
        <link rel="stylesheet" href="./styles/basket.css" />
        <link rel="stylesheet" href="./styles/dialog.css" />
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="./styles/responsive.css" />

        <script src="./scripts/db.js"></script>
        <script src="./scripts/template.js"></script>
        <script src="script.js" defer></script>

        <link
            rel="shortcut icon"
            href="./assets/icons/favicon_bestell_app_orange.svg"
            type="image/x-icon"
        />
    </head>
    <body onload="init()">
        <header id="home" class="header_main">
            <img
                class="logo_main"
                src="./assets/icons/logo_bestellapp.svg"
                alt="Bestell App Logo"
            />
            <img
                class="logo_menu"
                src="./assets/icons/menu.svg"
                alt="Menu Placeholder Image"
            />
        </header>
        <main>
            <div class="content_hero">
                <section class="hero_section">
                    <div class="hero_background">
                        <div class="background_image">
                            <img
                                class="burger_logo"
                                src="./assets/img/logo_burger.png"
                                alt="Burger Logo"
                            />
                        </div>
                    </div>
                    <div class="hero_content">
                        <div class="heading_box">
                            <h1><span class="heading_highlight">Burger</span>House</h1>
                            <div class="rating_box">
                                <img src="./assets/icons/star.svg" alt="Star Icon" />
                                <p>4,1 <span class="ratings">(317)</span></p>
                            </div>
                        </div>
                        <p>
                            The best of Burgers, Pizza, and Greens, all in one great
                            place.
                        </p>
                    </div>
                </section>
            </div>
            <div class="content_wrapper content">
                <div class="menu_wrapper">
                    <div class="category_background"></div>
                    <section class="menu_section">
                        <header class="category_header">
                            <img
                                class="category_icon_small"
                                src="./assets/icons/burger_icon.svg"
                                alt="Burger Icon"
                            />
                            <img
                                class="category_icon_big"
                                src="./assets/icons/burger_icon.svg"
                                alt="Burger Icon"
                            />
                            <div class="headline_category">
                                <h2>Burger<span class="sandwich"> & Sandwiches</span></h2>
                            </div>
                        </header>
                        <section id="dishes_burger" class="dishes"></section>
                    </section>
                    <div class="category_background"></div>
                    <section class="menu_section">
                        <header class="category_header">
                            <img
                                class="category_icon_small"
                                src="./assets/icons/pizza_icon.svg"
                                alt="Pizza Icon"
                            />
                            <img
                                class="category_icon_big"
                                src="./assets/icons/pizza_icon.svg"
                                alt="Pizza Icon"
                            />
                            <div class="headline_category">
                                <h2>Pizza <span class="pizza">(30cm)</span></h2>
                            </div>
                        </header>
                        <section id="dishes_pizza" class="dishes"></section>
                    </section>
                    <div class="category_background"></div>
                    <section class="menu_section">
                        <header class="category_header">
                            <img
                                class="category_icon_small"
                                src="./assets/icons/salad_icon.svg"
                                alt="Salad Icon"
                            />
                            <img
                                class="category_icon_big"
                                src="./assets/icons/salad_icon.svg"
                                alt="Salad Icon"
                            />
                            <div class="headline_category">
                                <h2>Salad</h2>
                            </div>
                        </header>
                        <section id="dishes_salad" class="dishes"></section>
                    </section>
                </div>
                <div id="basket_backdrop" class="backdrop_basket"></div>
                <div class="basket_outer_box">
                    <article id="basket_display" class="basket display_basket">
                        <div class="basket_close_btn">
                            <button onclick="toggleBasket()">
                                <img
                                    src="./assets/icons/close_icon.svg"
                                    alt="close Basket"
                                />
                            </button>
                        </div>
                        <div class="basket_wrapper">
                            <div class="basket_header">
                                <h4>Your Basket</h4>
                            </div>
                            <div id="basket_box" class="basket_container">
                                <div id="basket_content" class="basket_items"></div>
                                <div id="basket_checkout" class="checkout"></div>
                            </div>
                        </div>
                    </article>
                </div>
                <dialog
                    id="order_confirmation"
                    class="dialog_wrapper"
                    onclick="closeDialog()"
                ></dialog>
            </div>
        </main>
        <footer class="footer_main">
            <div class="footer_content">
                <div class="copyright">
                    <img src="./assets/icons/copyright_icon.svg" alt="Copyright" />
                    <p>2025 BurgerHouse</p>
                </div>
                <div class="imprint">
                    <p>Imprint</p>
                    <p>Cookie Preferences</p>
                </div>
            </div>
        </footer>
        <nav>
            <ul>
                <li>
                    <a href="#home">
                        <button>
                            <img src="./assets/icons/home_icon.svg" alt="Home" />
                        </button>
                    </a>
                </li>
                <li>
                    <button>
                        <img src="./assets/icons/person_icon.svg" alt="Profile" />
                    </button>
                </li>
                <li>
                    <button>
                        <img src="./assets/icons/paperbag_icon.svg" alt="Orders" />
                    </button>
                </li>
                <li>
                    <button onclick="toggleBasket()">
                        <img src="./assets/icons/basket_icon.svg" alt="Basket" />
                        <div id="amount_circle"></div>
                    </button>
                </li>
            </ul>
        </nav>
    </body>
</html>
